name: Byg TV-app

# Bygger appen automatisk ved push og kan udløses manuelt.
# - LG webOS (.ipk): bygges helt færdig og kan installeres direkte.
# - Samsung Tizen: web-bundlen pakkes; den skal signeres lokalt med
#   dit eget certifikat (se docs/INSTALL-SAMSUNG.md) - derfor kun en zip her.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  webos:
    name: Byg LG webOS (.ipk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer webOS CLI
        run: npm install -g @webosose/ares-cli

      - name: Saml + pak .ipk
        run: |
          node scripts/assemble.js webos
          mkdir -p dist
          ares-package build/webos --outdir dist --no-tmp

      - name: Upload .ipk
        uses: actions/upload-artifact@v4
        with:
          name: mytv-webos-ipk
          path: dist/*.ipk

  tizen:
    name: Pak Samsung Tizen web-bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Saml Tizen-bundle
        run: |
          node scripts/assemble.js tizen
          mkdir -p dist
          cd build/tizen && zip -r ../../dist/mytv-tizen-source.zip . && cd -

      - name: Upload Tizen-bundle
        uses: actions/upload-artifact@v4
        with:
          name: mytv-tizen-source
          path: dist/mytv-tizen-source.zip

  release:
    name: Udgiv ved tag
    needs: [webos, tizen]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Opret release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.ipk
            artifacts/**/*.zip
